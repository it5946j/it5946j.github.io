<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamFlix</title>
<style>
:root{--red:#e50914;--bg:#141414;--card:#1f1f1f;--text:#fff;--muted:#b3b3b3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.hidden{display:none!important}

/* profiles */
#profiles{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:1rem}
#profiles h1{font-size:clamp(1.8rem,5vw,3.2rem);font-weight:500}
.profile-list{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
.profile{width:110px;text-align:center;color:var(--muted)}
.profile .av{width:110px;height:110px;border-radius:6px;display:grid;place-items:center;font-size:3rem;border:3px solid transparent;transition:.2s}
.profile:hover .av{border-color:#fff}
.profile:hover{color:#fff}

/* nav */
nav{position:fixed;top:0;width:100%;z-index:50;display:flex;align-items:center;gap:1.5rem;padding:.9rem 4%;background:linear-gradient(#000c,transparent);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{color:var(--red);font-weight:900;font-size:1.7rem;letter-spacing:1px}
nav a{color:#e5e5e5;font-size:.9rem;text-decoration:none;cursor:pointer}
nav a.active,nav a:hover{color:#fff;font-weight:600}
.spacer{flex:1}
#search{background:#000a;border:1px solid #fff6;color:#fff;padding:.4rem .7rem;border-radius:4px;width:min(220px,40vw)}
#me{font-size:1.5rem}

/* hero */
.hero{min-height:80vh;display:flex;align-items:flex-end;padding:0 4% 8%;position:relative}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,var(--bg))}
.hero-body{position:relative;z-index:2;max-width:560px}
.hero h2{font-size:clamp(2.2rem,6vw,4.5rem);line-height:1.05;margin-bottom:1rem}
.hero p{color:#e5e5e5;line-height:1.5;margin-bottom:1.2rem;text-shadow:0 1px 4px #000}
.btn{padding:.7rem 1.6rem;border-radius:4px;font-weight:700;margin-right:.6rem}
.btn.play{background:#fff;color:#000}.btn.info{background:#6d6d6eb3}
.btn:hover{opacity:.8}

/* rows */
main{margin-top:-6vh;position:relative;z-index:3;padding-bottom:3rem}
.row{margin-bottom:2rem}
.row h3{padding:0 4%;margin-bottom:.6rem;font-size:1.25rem}
.track{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 4% 1.2rem;scroll-snap-type:x proximity;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:clamp(130px,16vw,220px);aspect-ratio:2/3;border-radius:6px;position:relative;overflow:hidden;scroll-snap-align:start;transition:transform .25s;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:.7rem}
.card:hover{transform:scale(1.08);z-index:5;box-shadow:0 8px 24px #000a}
.card .em{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:3.2rem;opacity:.9}
.card .t{font-weight:700;font-size:.95rem;text-shadow:0 1px 4px #000;position:relative}
.card .m{font-size:.72rem;color:#ddd;position:relative}
.empty{padding:0 4%;color:var(--muted)}
#results{padding:6rem 4% 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem}
#results .card{width:100%}

/* modal */
#modal{position:fixed;inset:0;background:#000b;z-index:80;display:grid;place-items:center;padding:1rem}
.sheet{background:var(--card);width:min(780px,100%);max-height:92vh;overflow:auto;border-radius:10px;position:relative}
.sheet .banner{height:300px;display:grid;place-items:center;font-size:6rem;position:relative}
.sheet .banner::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,var(--card))}
.sheet .x{position:absolute;top:.7rem;right:.7rem;background:#000a;width:36px;height:36px;border-radius:50%;z-index:3;font-size:1.1rem}
.sheet .info{padding:0 2rem 2rem;margin-top:-3rem;position:relative;z-index:2}
.sheet h2{font-size:2rem;margin-bottom:.5rem}
.meta{color:var(--muted);font-size:.9rem;margin:.6rem 0}
.meta b{color:#46d369}
.sheet p{line-height:1.55;margin-bottom:1rem}
.btn.list{background:#2a2a2a;border:1px solid #fff5}

/* player */
#player{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column}
footer{text-align:center;color:#666;font-size:.78rem;padding:2rem 1rem}
@media(max-width:600px){nav{gap:.8rem}nav .hide-s{display:none}.sheet .banner{height:200px}}

.card{background:#222}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#000d)}
.card .t,.card .m{z-index:2}
.card .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero{background-size:cover;background-position:center top}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000e 10%,#0004 70%)}
.sheet .banner{background-size:cover;background-position:center 20%}
.sheet .banner .em{display:none}
.note{padding:6rem 4% 2rem;color:var(--muted);line-height:1.6}
.skel{flex:0 0 auto;width:clamp(130px,16vw,220px);aspect-ratio:2/3;border-radius:6px;background:linear-gradient(90deg,#222,#2c2c2c,#222);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#player{background:#000}
#pframe,#pframe iframe{flex:1;width:100%;height:100%;border:0}
#ptitle{position:absolute;top:1rem;left:1.2rem;font-size:1.1rem;font-weight:600;z-index:3;text-shadow:0 1px 4px #000;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pclose{position:absolute;top:.8rem;right:1rem;font-size:1.6rem;z-index:3;background:#000a;width:40px;height:40px;border-radius:50%}
.legal{color:var(--muted);font-size:.78rem;margin-top:1rem}
.legal a{color:#9ab;text-decoration:underline}
</style>
</head>
<body>

<div id="profiles">
  <h1>Who's watching?</h1>
  <div class="profile-list" id="plist"></div>
</div>

<nav id="nav" class="hidden">
  <span class="logo">STREAMFLIX</span>
  <a data-view="home" class="active">Home</a>
  <a data-view="open" class="hide-s">Open Movies</a>
  <a data-view="list">My List</a>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Search free films…" aria-label="Search">
  <span id="me"></span>
</nav>

<section class="hero hidden" id="hero"></section>
<div id="results" class="hidden"></div>
<main id="rows" class="hidden"></main>
<footer class="hidden" id="foot">Films are streamed from the Internet Archive’s free public collections. Copyright status is set by each uploader — check a title’s Archive.org page before reusing it.</footer>

<div id="modal" class="hidden"></div>

<div id="player" class="hidden">
  <div id="ptitle"></div>
  <button id="pclose" aria-label="Close player">✕</button>
  <div id="pframe"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- Internet Archive: free / public-domain film catalogue ---------- */
const IA="https://archive.org";
const BASE="collection:feature_films AND mediatype:movies";
const ROWS=[
 ["Popular Free Films",BASE],
 ["Horror & Thrillers",BASE+" AND (subject:horror OR subject:thriller)"],
 ["Comedy",BASE+" AND subject:comedy"],
 ["Sci-Fi",BASE+' AND (subject:"science fiction" OR subject:sci-fi)'],
 ["Westerns",BASE+" AND subject:western"],
 ["Film Noir & Crime",BASE+' AND (subject:"film noir" OR subject:crime)'],
 ["Drama",BASE+" AND subject:drama"],
 ["Open Movies (Creative Commons)",'mediatype:movies AND title:("Big Buck Bunny" OR Sintel OR "Tears of Steel" OR "Elephants Dream" OR "Cosmos Laundromat" OR "Agent 327")']
];
const first=x=>Array.isArray(x)?x[0]:x;
const plain=h=>{try{return(new DOMParser().parseFromString(String(h||""),"text/html").body.textContent||"").replace(/\s+/g," ").trim()}catch{return""}};
function norm(d){
  if(!d||!d.identifier)return null;
  const subj=[].concat(d.subject||[]).map(String).filter(x=>x.length<22);
  return{id:String(d.identifier),title:plain(first(d.title))||"Untitled",year:String(first(d.year)||"").slice(0,4),
    creator:plain(first(d.creator)||""),genre:subj[0]||"Film",desc:plain(first(d.description)).slice(0,450)};
}
const poster=id=>`${IA}/services/img/${encodeURIComponent(id)}`;
async function fetchFilms(q,rows=20){
  const u=new URL(IA+"/advancedsearch.php");
  u.searchParams.set("q",q);
  ["identifier","title","year","description","subject","creator"].forEach(f=>u.searchParams.append("fl[]",f));
  u.searchParams.append("sort[]","downloads desc");
  u.searchParams.set("rows",rows);u.searchParams.set("output","json");
  const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  return j.response.docs.map(norm).filter(Boolean);
}

/* ---------- state ---------- */
const meta=store.get("sf_meta",{});            // id -> film (so My List / history work offline of search)
const remember=a=>{a.forEach(f=>meta[f.id]=f);const k=Object.keys(meta);if(k.length>400)k.slice(0,k.length-400).forEach(x=>delete meta[x]);store.set("sf_meta",meta)};
let user=store.get("sf_user",null), list=store.get("sf_list",[]).filter(x=>typeof x==="string"), hist=store.get("sf_hist",[]);
let view="home", rowsData=null, loadErr=null;

/* ---------- profiles ---------- */
const PROFILES=[["Mayan","😎",30],["Guest","🙂",200],["Kids","🧸",120],["Movie Night","🍿",340]];
$("#plist").innerHTML=PROFILES.map((p,i)=>`<button class="profile" data-i="${i}"><div class="av" style="background:hsl(${p[2]} 60% 40%)">${p[1]}</div>${p[0]}</button>`).join("");
$("#plist").onclick=e=>{const b=e.target.closest(".profile");if(!b)return;user=PROFILES[b.dataset.i];store.set("sf_user",user);start()};
function start(){
  $("#profiles").classList.add("hidden");
  ["#nav","#hero","#rows","#foot"].forEach(s=>$(s).classList.remove("hidden"));
  $("#me").textContent=user[1];
  load();
}

/* ---------- rendering ---------- */
const cardHTML=f=>`<div class="card" data-id="${esc(f.id)}" tabindex="0" role="button" aria-label="${esc(f.title)}">
  <img loading="lazy" src="${poster(f.id)}" alt="" onerror="this.remove()">
  <div class="t">${esc(f.title)}</div><div class="m">${esc([f.year,f.genre].filter(Boolean).join(" · "))}</div></div>`;
const rowHTML=(name,items)=>items&&items.length?`<section class="row"><h3>${esc(name)}</h3><div class="track">${items.map(cardHTML).join("")}</div></section>`:"";
const skeleton=()=>ROWS.slice(0,3).map(r=>`<section class="row"><h3>${esc(r[0])}</h3><div class="track">${'<div class="skel"></div>'.repeat(9)}</div></section>`).join("");

async function load(){
  $("#rows").innerHTML=skeleton();
  $("#hero").style.background="#222";$("#hero").innerHTML="";
  loadErr=null;
  const res=await Promise.allSettled(ROWS.map(r=>fetchFilms(r[1],r[0].startsWith("Popular")?24:18)));
  rowsData=ROWS.map((r,i)=>({name:r[0],items:res[i].status==="fulfilled"?res[i].value:[]}));
  rowsData.forEach(r=>remember(r.items));
  if(rowsData.every(r=>!r.items.length)){
    loadErr=res.find(r=>r.status==="rejected")?.reason?.message||"no results";
  }
  render();
}

function render(){
  const results=$("#results"),rows=$("#rows"),hero=$("#hero");
  results.classList.add("hidden");rows.classList.remove("hidden");hero.classList.remove("hidden");
  if(!rowsData)return;
  if(loadErr){hero.classList.add("hidden");
    rows.innerHTML=`<div class="note"><b>Couldn't reach the Internet Archive</b> (${esc(loadErr)}).<br>Check your connection or an ad-blocker, then <button class="btn info" id="retry">Retry</button></div>`;
    return;}
  const mine=list.map(id=>meta[id]).filter(Boolean);
  let h="",pool;
  if(view==="list"){
    if(!mine.length){hero.classList.add("hidden");rows.innerHTML=`<p class="empty" style="padding-top:7rem">Your list is empty. Open a title and press “+ My List”.</p>`;return}
    pool=mine;h=rowHTML("My List",mine);
  }else if(view==="open"){
    const o=rowsData.find(r=>r.name.startsWith("Open"));pool=o.items;h=rowHTML(o.name,o.items)||`<p class="empty">Nothing found.</p>`;
  }else{
    pool=rowsData[0].items;
    h+=rowHTML("Continue Watching",hist.map(id=>meta[id]).filter(Boolean).slice(0,15));
    h+=rowHTML("My List",mine);
    rowsData.forEach(r=>h+=rowHTML(r.name,r.items));
  }
  setHero(pool);
  rows.innerHTML=h;
}
function setHero(pool){
  const hero=$("#hero");
  const f=pool[new Date().getDate()%Math.min(pool.length,10)]||pool[0];
  if(!f){hero.classList.add("hidden");return}
  hero.style.backgroundImage=`url("${poster(f.id)}")`;hero.style.backgroundColor="#222";
  hero.innerHTML=`<div class="hero-body"><h2>${esc(f.title)}</h2><p>${esc(f.desc||"Free to watch, courtesy of the Internet Archive.")}</p>
   <button class="btn play" data-play="${esc(f.id)}">▶ Play</button><button class="btn info" data-info="${esc(f.id)}">ⓘ More Info</button></div>`;
}

/* ---------- search (live, debounced) ---------- */
let tmr=null,seq=0;
$("#search").oninput=()=>{clearTimeout(tmr);tmr=setTimeout(runSearch,350)};
async function runSearch(){
  const raw=$("#search").value.trim(),res=$("#results");
  if(!raw){render();return}
  const q=raw.replace(/[^\p{L}\p{N}\s'-]/gu," ").trim();if(!q)return;
  const my=++seq;
  $("#hero").classList.add("hidden");$("#rows").classList.add("hidden");res.classList.remove("hidden");
  res.innerHTML=`<p class="empty">Searching…</p>`;
  try{
    const items=await fetchFilms(`${BASE} AND (title:(${q}) OR subject:(${q}) OR creator:(${q}))`,40);
    if(my!==seq)return;
    remember(items);
    res.innerHTML=items.length?items.map(cardHTML).join(""):`<p class="empty">No free films found for “${esc(raw)}”.</p>`;
  }catch(e){if(my===seq)res.innerHTML=`<p class="empty">Search failed (${esc(e.message)}).</p>`}
}

/* ---------- nav ---------- */
$("#nav").onclick=e=>{const a=e.target.closest("a");if(!a)return;view=a.dataset.view;$("#search").value="";seq++;
  document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("active",x===a));render();scrollTo(0,0)};
$("#me").onclick=()=>{store.set("sf_user",null);location.reload()};
addEventListener("scroll",()=>$("#nav").classList.toggle("solid",scrollY>40));

/* ---------- modal ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="retry")return load();
  const c=e.target.closest(".card");if(c)return openModal(c.dataset.id);
  const pl=e.target.closest("[data-play]");if(pl)return play(pl.dataset.play);
  const inf=e.target.closest("[data-info]");if(inf)return openModal(inf.dataset.info);
  if(e.target.id==="modal"||e.target.closest(".x"))closeModal();
  const tg=e.target.closest("[data-toggle]");if(tg){const id=tg.dataset.toggle;list=list.includes(id)?list.filter(x=>x!==id):[...list,id];store.set("sf_list",list);openModal(id);if($("#results").classList.contains("hidden"))render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#player").classList.contains("hidden")?closeModal():closePlayer()}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("card")){e.preventDefault();openModal(e.target.dataset.id)}
});
function openModal(id){
  const f=meta[id];if(!f)return;
  const m=$("#modal"),inList=list.includes(id);
  const similar=Object.values(meta).filter(x=>x.genre===f.genre&&x.id!==id).slice(0,8);
  m.innerHTML=`<div class="sheet"><button class="x" aria-label="Close">✕</button>
   <div class="banner" style="background-image:url('${poster(id)}');background-color:#333"></div>
   <div class="info"><h2>${esc(f.title)}</h2>
   <div class="meta"><b>Free</b> · ${esc([f.year,f.creator,f.genre].filter(Boolean).join(" · "))}</div>
   <p>${esc(f.desc||"No description available.")}</p>
   <button class="btn play" data-play="${esc(id)}">▶ Play</button>
   <button class="btn list" data-toggle="${esc(id)}">${inList?"✓ In My List":"+ My List"}</button>
   <div class="legal">Streamed from the Internet Archive · <a href="${IA}/details/${encodeURIComponent(id)}" target="_blank" rel="noopener">View license &amp; details on Archive.org</a></div>
   ${similar.length?`<h3 style="margin:1.5rem 0 .6rem">More like this</h3><div class="track" style="padding:0">${similar.map(cardHTML).join("")}</div>`:""}
   </div></div>`;
  m.classList.remove("hidden");document.body.style.overflow="hidden";
  m.querySelector(".sheet").scrollTop=0;
}
function closeModal(){$("#modal").classList.add("hidden");document.body.style.overflow=""}

/* ---------- player (Internet Archive embed) ---------- */
function play(id){
  const f=meta[id];if(!f)return;
  closeModal();
  hist=[id,...hist.filter(x=>x!==id)].slice(0,30);store.set("sf_hist",hist);
  $("#ptitle").textContent=f.title;
  $("#pframe").innerHTML=`<iframe src="${IA}/embed/${encodeURIComponent(id)}" title="${esc(f.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  $("#player").classList.remove("hidden");document.body.style.overflow="hidden";
}
function closePlayer(){$("#pframe").innerHTML="";$("#player").classList.add("hidden");document.body.style.overflow="";if($("#results").classList.contains("hidden"))render()}
$("#pclose").onclick=closePlayer;

if(user)start();
</script>
</body>
</html>
